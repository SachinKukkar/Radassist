name: radassist

services:
  api:
    build:
      context: ./backend
    image: radassist-api:dev
    environment:
      RADASSIST_ENVIRONMENT: development
      RADASSIST_LOG_JSON: "true"
      RADASSIST_DATABASE_URL: postgresql://${POSTGRES_USER:-radassist}:${POSTGRES_PASSWORD:-radassist}@db:5432/${POSTGRES_DB:-radassist}
      RADASSIST_REDIS_URL: redis://redis:6379/0
      RADASSIST_S3_ENDPOINT_URL: http://storage:8333
      RADASSIST_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-radassist}
      RADASSIST_S3_SECRET_KEY: ${S3_SECRET_KEY:-radassist-dev-secret}
      RADASSIST_S3_BUCKET: ${S3_BUCKET:-radassist-images}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radassist}
      POSTGRES_DB: ${POSTGRES_DB:-radassist}
    volumes:
      # PostgreSQL 18+ images: mount at /var/lib/postgresql (NOT /var/lib/postgresql/data)
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data"]
    environment:
      # SeaweedFS reads these to create the S3 credentials and pre-create the bucket
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-radassist}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-radassist-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-radassist-images}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
