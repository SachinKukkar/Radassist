[project]
name = "radassist-ml"
version = "0.1.0"
description = "RadAssist ML: dataset tooling now, training and model export later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pydicom>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------- Ruff: linter + formatter ----------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "G", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # `assert` is expected in tests

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
strict = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ---------- coverage ----------
[tool.coverage.run]
source = ["radassist_ml"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
