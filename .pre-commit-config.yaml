repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files   # stops you accidentally committing model weights
        args: [--maxkb=1000]
      - id: detect-private-key

  # Ruff and mypy run through uv, so they use the exact versions pinned in uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run --directory backend ruff check --fix .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff (format)
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: mypy
        name: mypy (types)
        entry: uv run --directory backend mypy app
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
